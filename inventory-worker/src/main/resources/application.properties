spring.application.name=inventory-worker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
app.kafka.inventory-topic=inventory_events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.acks=all
# Limita tambien el bloqueo de send() al solicitar metadatos o espacio en el buffer.
spring.kafka.producer.properties[max.block.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
# Reintentos acotados definidos en InventoryRabbitConfig; nunca reencolar indefinidamente.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
