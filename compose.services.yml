# Fragmento para incorporar al docker-compose.yml principal del equipo.
# kafka y rabbitmq deben existir en la misma red de Compose.
services:
  notification-worker:
    build: ./notification-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0
    depends_on:
      - rabbitmq
      - kafka
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  analytics-service:
    build: ./analytics-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: analytics-service
      SERVER_PORT: 8082
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  dashboard-aggregator:
    build: ./dashboard-aggregator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: dashboard-aggregator
      SERVER_PORT: 8083
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
