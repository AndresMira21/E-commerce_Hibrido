spring.application.name=order-api
server.port=8084
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/ecommerce_inventory}
spring.datasource.username=${POSTGRES_USERNAME:ecommerce}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/orders-migration
spring.flyway.default-schema=orders
spring.flyway.schemas=orders
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# La espera de metadatos y entrega debe vencer antes del timeout HTTP asincrono.
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.mvc.async.request-timeout=20000
