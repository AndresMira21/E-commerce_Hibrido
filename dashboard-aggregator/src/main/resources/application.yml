spring:
  application:
    name: dashboard-aggregator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:dashboard-aggregator}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.ecommerce.hibrido.dashboard.model.StatusEvent
        spring.json.trusted.packages: com.ecommerce.hibrido.dashboard.model
        spring.json.use.type.headers: false
server:
  port: ${SERVER_PORT:8083}
app:
  kafka:
    billing-topic: billing_events
    inventory-topic: inventory_events
    notification-topic: notification_events
