# Instalar en /etc/nginx/conf.d/00-ecommerce-http.conf (contexto http).
server_tokens off;
map $http_upgrade $ecommerce_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=ecommerce_orders:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=ecommerce_connections:10m;
