# Contexto server. Se mantienen las rutas al upstream (sin reescritura de URI).
client_max_body_size 16k;
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
limit_conn ecommerce_connections 20;
limit_req_status 429;

location ~ (^|/)\. { deny all; }
location ~* \.(?:pem|key|env|sql|dump|log|bak)$ { deny all; }

location = /order {
    limit_except POST { deny all; }
    limit_req zone=ecommerce_orders burst=3 nodelay;
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_pass http://127.0.0.1:8084;
}
location = /api/orders {
    limit_except POST { deny all; }
    limit_req zone=ecommerce_orders burst=3 nodelay;
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_pass http://127.0.0.1:8084;
}
location = /orders/status {
    limit_except GET { deny all; }
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_pass http://127.0.0.1:8083;
}
location = /ws {
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ecommerce_connection_upgrade;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8083;
}
location ^~ /ws/ {
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ecommerce_connection_upgrade;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8083;
}
location = /analytics { return 404; }
location ^~ /analytics/ { return 404; }
location / {
    limit_except GET { deny all; }
    include /etc/nginx/snippets/ecommerce-proxy.conf;
    proxy_pass http://127.0.0.1:8083;
}
