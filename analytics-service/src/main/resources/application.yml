spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:analytics-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.ecommerce.hibrido.analytics.model.OrderReceivedEvent
        spring.json.trusted.packages: com.ecommerce.hibrido.analytics.model
        spring.json.use.type.headers: false
server:
  port: ${SERVER_PORT:8082}
app:
  kafka:
    orders-topic: new_orders
